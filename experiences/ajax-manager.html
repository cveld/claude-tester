<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ajax Manager</title>
  <link rel="stylesheet" href="../style.css" />
  <style>
    :root { --accent: #d2122e; }

    main.experience { max-width: 780px; }

    .card {
      background: var(--white);
      border-radius: var(--radius);
      padding: 1.5rem;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
      margin-bottom: 1.25rem;
    }
    .card h2 { font-size: 1.1rem; margin-bottom: .75rem; }
    .card h3 { font-size: 1rem; margin: .75rem 0 .5rem; color: var(--muted); }

    .tabs { display: flex; gap: .5rem; margin-bottom: 1.25rem; flex-wrap: wrap; }
    .tabs button {
      border: 2px solid #e2e8f0;
      background: var(--white);
      color: var(--text);
      padding: .5rem 1rem;
      border-radius: .6rem;
      font-weight: 600;
      font-size: .85rem;
      cursor: pointer;
      transition: border-color .15s, color .15s;
    }
    .tabs button.active { border-color: var(--accent); color: var(--accent); }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: .75rem;
      text-align: center;
    }
    .summary-grid .stat {
      background: var(--bg);
      border-radius: .6rem;
      padding: .75rem .5rem;
    }
    .summary-grid .stat .label { font-size: .75rem; color: var(--muted); }
    .summary-grid .stat .value { font-size: 1.3rem; font-weight: 800; margin-top: .15rem; }

    table.league { width: 100%; border-collapse: collapse; font-size: .85rem; }
    table.league th, table.league td { padding: .45rem .4rem; text-align: center; border-bottom: 1px solid #edf1f5; }
    table.league th { color: var(--muted); font-weight: 600; font-size: .75rem; }
    table.league td.club { text-align: left; font-weight: 600; }
    table.league tr.ajax-row td { background: #fdf1f2; }
    table.league tr.ajax-row td.club { color: var(--accent); }
    table.league td.pos { position: relative; }
    table.league tr.zone-cl td.pos::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: #10b981; }
    table.league tr.zone-eu td.pos::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: #f59e0b; }
    table.league tr.zone-degr td.pos::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: #ef4444; }

    .legend { display: flex; gap: 1rem; flex-wrap: wrap; font-size: .75rem; color: var(--muted); margin-top: .75rem; }
    .legend span { display: inline-flex; align-items: center; gap: .35rem; }
    .legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }

    .player-row {
      display: flex;
      align-items: center;
      gap: .75rem;
      padding: .5rem 0;
      border-bottom: 1px solid #edf1f5;
    }
    .player-row:last-child { border-bottom: none; }
    .player-row .pos-badge {
      width: 2.2rem; height: 1.5rem;
      border-radius: .35rem;
      background: var(--bg);
      color: var(--muted);
      font-size: .7rem;
      font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .player-row .name { flex: 1; font-weight: 600; font-size: .9rem; }
    .player-row .rating { font-size: .8rem; color: var(--muted); width: 2rem; text-align: right; }
    .player-row .value { font-size: .78rem; color: var(--muted); width: 4.2rem; text-align: right; flex-shrink: 0; }
    .fitness-bar { width: 90px; height: 8px; border-radius: 4px; background: #e2e8f0; overflow: hidden; flex-shrink: 0; }
    .fitness-bar i { display: block; height: 100%; background: #10b981; }
    .player-row.rested { opacity: .5; }
    .player-row.injured { opacity: .6; }
    .player-row label { display: flex; align-items: center; gap: .35rem; font-size: .75rem; color: var(--muted); cursor: pointer; white-space: nowrap; }
    .injury-tag { font-size: .78rem; color: #b91c1c; white-space: nowrap; }
    .warn-text { color: #b91c1c; font-size: .8rem; margin: .25rem 0 .5rem; }
    .small-btn { padding: .35rem .8rem; font-size: .75rem; }

    .tactic-options { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); gap: .75rem; margin: 1rem 0; }
    .tactic-options label {
      border: 2px solid #e2e8f0;
      border-radius: .6rem;
      padding: .75rem;
      cursor: pointer;
      display: block;
      transition: border-color .15s;
    }
    .tactic-options input { display: none; }
    .tactic-options input:checked + span { color: var(--accent); }
    .tactic-options label:has(input:checked) { border-color: var(--accent); }
    .tactic-options .t-name { font-weight: 700; display: block; margin-bottom: .25rem; }
    .tactic-options .t-desc { font-size: .78rem; color: var(--muted); }

    .scouting { text-align: center; font-size: .85rem; color: var(--muted); margin: .5rem 0 1rem; }
    .scouting strong { color: var(--text); }
    .counter-tag { color: #047857; font-weight: 700; }

    .fixture { text-align: center; margin: 1rem 0; }
    .fixture .vs { font-size: 1.4rem; font-weight: 800; }
    .fixture .venue { font-size: .8rem; color: var(--muted); margin-top: .25rem; }

    .score { text-align: center; font-size: 2.2rem; font-weight: 800; margin: 1rem 0; }
    .score .team-name { font-size: .95rem; font-weight: 600; color: var(--muted); display: block; margin-top: .25rem; }

    .events { list-style: none; font-size: .85rem; margin: 1rem 0; }
    .events li { padding: .35rem 0; border-bottom: 1px solid #edf1f5; display: flex; gap: .5rem; }
    .events li .min { color: var(--muted); width: 2.5rem; flex-shrink: 0; }
    .events li.home { font-weight: 600; }
    .events li.injury { color: #b91c1c; }

    .banner {
      border-radius: .6rem;
      padding: 1rem;
      text-align: center;
      font-weight: 700;
      margin-bottom: 1rem;
    }
    .banner.success { background: #ecfdf5; color: #047857; }
    .banner.fail { background: #fef2f2; color: #b91c1c; }

    .history-list { list-style: none; font-size: .85rem; }
    .history-list li { display: flex; justify-content: space-between; padding: .35rem 0; border-bottom: 1px solid #edf1f5; }

    .actions { display: flex; gap: .75rem; flex-wrap: wrap; margin-top: 1rem; }
    .muted-small { font-size: .8rem; color: var(--muted); margin-top: .5rem; }
    .form-badges { display: flex; gap: .3rem; justify-content: center; margin-top: .35rem; }
    .form-badges span {
      width: 1.5rem; height: 1.5rem; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: .7rem; font-weight: 700; color: #fff;
    }
    .form-badges .W { background: #10b981; }
    .form-badges .D { background: #f59e0b; }
    .form-badges .L { background: #ef4444; }
  </style>
</head>
<body>
  <header>
    <nav>
      <span class="logo">Ajax Manager</span>
      <a href="../index.html" class="back-link">← Terug</a>
    </nav>
  </header>

  <main class="experience">
    <h1>🔴⚪ Ajax Manager</h1>
    <div id="app"></div>
  </main>

  <script>
    const HOME_ADV = 0.35;
    const SKILL_DIVISOR = 12; // lager = sterkteverschil weegt zwaarder mee dan geluk
    const POS_NEED = { GK: 1, DEF: 4, MID: 3, ATT: 3 };
    const SAVE_KEY = 'ajax-manager-save-v2';
    const STYLES = ['Aanvallend', 'Gebalanceerd', 'Verdedigend'];

    let currentView = 'dashboard';
    let pendingTactic = 'Gebalanceerd';
    let lastMatchResult = null;
    let lastClMatchResult = null;
    let lastClFinalSummary = null;

    const TACTICS = {
      Aanvallend:   { attack: 1.15, defense: 0.85, desc: 'Meer druk voorin, kwetsbaarder achterin.' },
      Gebalanceerd: { attack: 1.0,  defense: 1.0,  desc: 'Een neutrale, evenwichtige aanpak.' },
      Verdedigend:  { attack: 0.85, defense: 1.15, desc: 'Stevig achterin, minder scherp voorin.' },
    };

    function getCounterMultipliers(tactic, oppStyle) {
      if (oppStyle === 'Aanvallend' && tactic === 'Verdedigend') return { attack: 1.05, defense: 1.08 };
      if (oppStyle === 'Verdedigend' && tactic === 'Aanvallend') return { attack: 1.08, defense: 1.0 };
      return { attack: 1.0, defense: 1.0 };
    }

    function randomStyle() { return STYLES[randInt(0, STYLES.length - 1)]; }

    const CL_CLUBS = [
      { id: 'rma', name: 'Real Madrid', strength: 94 },
      { id: 'mci', name: 'Manchester City', strength: 92 },
      { id: 'bay', name: 'Bayern München', strength: 91 },
      { id: 'psg', name: 'Paris Saint-Germain', strength: 89 },
      { id: 'fcb', name: 'FC Barcelona', strength: 88 },
      { id: 'liv', name: 'Liverpool', strength: 88 },
      { id: 'int', name: 'Inter Milaan', strength: 85 },
      { id: 'bvb', name: 'Borussia Dortmund', strength: 84 },
    ];
    const CL_BONUS = { group: 150, semifinal: 400, finalist: 700, winner: 1200 };

    function baseTeams() {
      return [
        { id: 'ajx', name: 'Ajax', strength: 80, isAjax: true },
        { id: 'psv', name: 'PSV', strength: 85 },
        { id: 'fey', name: 'Feyenoord', strength: 83 },
        { id: 'az',  name: 'AZ', strength: 78 },
        { id: 'twe', name: 'FC Twente', strength: 76 },
        { id: 'utr', name: 'FC Utrecht', strength: 73 },
        { id: 'hee', name: 'sc Heerenveen', strength: 70 },
        { id: 'gae', name: 'Go Ahead Eagles', strength: 69 },
        { id: 'nec', name: 'NEC', strength: 68 },
        { id: 'for', name: 'Fortuna Sittard', strength: 66 },
        { id: 'spa', name: 'Sparta Rotterdam', strength: 67 },
        { id: 'her', name: 'Heracles Almelo', strength: 65 },
        { id: 'pec', name: 'PEC Zwolle', strength: 64 },
        { id: 'wil', name: 'Willem II', strength: 63 },
        { id: 'nac', name: 'NAC Breda', strength: 65 },
        { id: 'rkc', name: 'RKC Waalwijk', strength: 62 },
        { id: 'alm', name: 'Almere City FC', strength: 60 },
        { id: 'tel', name: 'Telstar', strength: 58 },
      ];
    }

    function baseSquad() {
      return [
        { id: 1, name: 'R. van Dijk', pos: 'GK', rating: 82, fitness: 100, rested: false, injuredUntil: -1 },
        { id: 2, name: 'B. Kessler', pos: 'GK', rating: 70, fitness: 100, rested: false, injuredUntil: -1 },

        { id: 3, name: 'J. Timmermans', pos: 'DEF', rating: 79, fitness: 100, rested: false, injuredUntil: -1 },
        { id: 4, name: 'D. Osei', pos: 'DEF', rating: 77, fitness: 100, rested: false, injuredUntil: -1 },
        { id: 5, name: 'L. de Ridder', pos: 'DEF', rating: 76, fitness: 100, rested: false, injuredUntil: -1 },
        { id: 6, name: 'M. Verhoeven', pos: 'DEF', rating: 75, fitness: 100, rested: false, injuredUntil: -1 },
        { id: 7, name: 'F. Bakker', pos: 'DEF', rating: 68, fitness: 100, rested: false, injuredUntil: -1 },
        { id: 8, name: 'S. el Idrissi', pos: 'DEF', rating: 66, fitness: 100, rested: false, injuredUntil: -1 },

        { id: 9,  name: 'K. Vermeulen', pos: 'MID', rating: 80, fitness: 100, rested: false, injuredUntil: -1 },
        { id: 10, name: 'T. Janssen', pos: 'MID', rating: 78, fitness: 100, rested: false, injuredUntil: -1 },
        { id: 11, name: 'Y. Boateng', pos: 'MID', rating: 77, fitness: 100, rested: false, injuredUntil: -1 },
        { id: 12, name: 'R. Smeets', pos: 'MID', rating: 69, fitness: 100, rested: false, injuredUntil: -1 },
        { id: 13, name: 'N. Kuypers', pos: 'MID', rating: 67, fitness: 100, rested: false, injuredUntil: -1 },
        { id: 14, name: 'A. Dekker', pos: 'MID', rating: 65, fitness: 100, rested: false, injuredUntil: -1 },

        { id: 15, name: 'S. Bergmann', pos: 'ATT', rating: 81, fitness: 100, rested: false, injuredUntil: -1 },
        { id: 16, name: 'I. Koffi', pos: 'ATT', rating: 83, fitness: 100, rested: false, injuredUntil: -1 },
        { id: 17, name: 'W. van der Berg', pos: 'ATT', rating: 79, fitness: 100, rested: false, injuredUntil: -1 },
        { id: 18, name: 'C. Marchetti', pos: 'ATT', rating: 70, fitness: 100, rested: false, injuredUntil: -1 },
      ];
    }

    const SURNAME_POOL = ['Vermeer', 'de Groot', 'Hendriks', 'Willems', 'Peeters', 'van Dam', 'Scholten', 'Mensah', 'Owusu', 'Kuipers', 'Postma', 'Brouwer', 'Visser', 'Bosman', 'Kramer', 'Achterberg'];
    const INITIAL_POOL = ['A', 'B', 'D', 'E', 'F', 'J', 'K', 'L', 'M', 'R', 'S', 'T'];
    function randomName() { return `${INITIAL_POOL[randInt(0, INITIAL_POOL.length - 1)]}. ${SURNAME_POOL[randInt(0, SURNAME_POOL.length - 1)]}`; }

    function generateTransferCandidates(obj) {
      const positions = ['GK', 'DEF', 'DEF', 'MID', 'MID', 'ATT'];
      return positions.map(pos => {
        const rating = randInt(60, 88);
        const price = Math.max(40, Math.round(rating * 8 + randInt(-30, 30)));
        return { id: obj.nextPlayerId++, name: randomName(), pos, rating, price };
      });
    }

    function freshTableRow(team) {
      return { ...team, played: 0, won: 0, draw: 0, lost: 0, gf: 0, ga: 0, pts: 0 };
    }

    function generateSchedule(teamIds) {
      const n = teamIds.length;
      let arr = teamIds.slice();
      const firstLeg = [];
      for (let r = 0; r < n - 1; r++) {
        const round = [];
        for (let i = 0; i < n / 2; i++) {
          const home = arr[i], away = arr[n - 1 - i];
          round.push(r % 2 === 0 ? [home, away] : [away, home]);
        }
        firstLeg.push(round);
        const fixed = arr[0];
        const rest = arr.slice(1);
        rest.unshift(rest.pop());
        arr = [fixed, ...rest];
      }
      const secondLeg = firstLeg.map(round => round.map(([h, a]) => [a, h]));
      return firstLeg.concat(secondLeg);
    }

    function newGameState() {
      const teams = baseTeams().map(t => freshTableRow({ ...t, style: randomStyle() }));
      const obj = {
        season: 1,
        matchdayIndex: 0,
        teams,
        squad: baseSquad(),
        schedule: generateSchedule(teams.map(t => t.id)),
        history: [],
        goalAchieved: false,
        budget: 300,
        form: 0,
        recentForm: [],
        trainingFocus: 'Conditie',
        nextPlayerId: 19,
        transferList: [],
        globalMatchCount: 0,
        clPending: false,
        clRun: null,
      };
      obj.transferList = generateTransferCandidates(obj);
      return obj;
    }

    function load() {
      try {
        const raw = localStorage.getItem(SAVE_KEY);
        if (raw) return JSON.parse(raw);
      } catch (e) { /* corrupt save, start fresh */ }
      return newGameState();
    }

    let state = load();

    function save() {
      localStorage.setItem(SAVE_KEY, JSON.stringify(state));
    }

    function resetGame() {
      if (!confirm('Weet je zeker dat je een nieuw spel wilt starten? Je huidige voortgang gaat verloren.')) return;
      state = newGameState();
      currentView = 'dashboard';
      save();
      render();
    }

    // ---------- helpers ----------
    function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
    function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

    function poisson(lambda) {
      lambda = Math.max(0.05, lambda);
      const L = Math.exp(-lambda);
      let k = 0, p = 1;
      do { k++; p *= Math.random(); } while (p > L);
      return k - 1;
    }

    function effective(p) { return p.rating * (0.7 + 0.3 * p.fitness / 100); }
    function isAvailable(p) { return p.injuredUntil <= state.globalMatchCount; }

    function ajaxTeam() { return state.teams.find(t => t.isAjax); }

    function sortedTable() {
      return state.teams.slice().sort((a, b) =>
        (b.pts - a.pts) || ((b.gf - b.ga) - (a.gf - a.ga)) || (b.gf - a.gf)
      );
    }

    function selectLineup(squad) {
      const groups = { GK: [], DEF: [], MID: [], ATT: [] };
      squad.forEach(p => { if (isAvailable(p)) groups[p.pos].push(p); });
      const lineup = [];
      Object.keys(POS_NEED).forEach(pos => {
        const pool = groups[pos].slice().sort((a, b) => effective(b) - effective(a));
        const nonRested = pool.filter(p => !p.rested);
        const rested = pool.filter(p => p.rested);
        const need = POS_NEED[pos];
        const chosen = nonRested.slice(0, need);
        if (chosen.length < need) chosen.push(...rested.slice(0, need - chosen.length));
        lineup.push(...chosen);
      });
      return lineup;
    }

    function restedCountAvailable(pos) {
      const pool = state.squad.filter(p => p.pos === pos && isAvailable(p));
      const restedCount = pool.filter(p => p.rested).length;
      return pool.length - POS_NEED[pos] - restedCount;
    }

    function toggleRest(id) {
      const p = state.squad.find(pl => pl.id === id);
      if (!p) return;
      if (!p.rested && restedCountAvailable(p.pos) <= 0) return;
      p.rested = !p.rested;
      save();
      render();
    }

    function simulateGenericMatch(homeTeam, awayTeam) {
      const homeVar = homeTeam.strength + randInt(-4, 4);
      const awayVar = awayTeam.strength + randInt(-4, 4);
      const hs = TACTICS[homeTeam.style], as = TACTICS[awayTeam.style];
      const homeAttack = homeVar * hs.attack, homeDefense = homeVar * hs.defense;
      const awayAttack = awayVar * as.attack, awayDefense = awayVar * as.defense;
      const expHome = clamp(1.3 + (homeAttack - awayDefense) / SKILL_DIVISOR + HOME_ADV, 0.15, 5.5);
      const expAway = clamp(1.3 + (awayAttack - homeDefense) / SKILL_DIVISOR - HOME_ADV * 0.5, 0.15, 5.5);
      return [poisson(expHome), poisson(expAway)];
    }

    function applyResult(homeId, awayId, hg, ag) {
      const home = state.teams.find(t => t.id === homeId);
      const away = state.teams.find(t => t.id === awayId);
      home.played++; away.played++;
      home.gf += hg; home.ga += ag;
      away.gf += ag; away.ga += hg;
      if (hg > ag) { home.won++; away.lost++; home.pts += 3; }
      else if (hg < ag) { away.won++; home.lost++; away.pts += 3; }
      else { home.draw++; away.draw++; home.pts++; away.pts++; }
    }

    function playMatchday() {
      const mdIdx = state.matchdayIndex;
      const matchday = state.schedule[mdIdx];
      const ajax = ajaxTeam();
      const ajaxFixture = matchday.find(([h, a]) => h === ajax.id || a === ajax.id);
      const ajaxIsHome = ajaxFixture[0] === ajax.id;
      const oppId = ajaxIsHome ? ajaxFixture[1] : ajaxFixture[0];
      const opp = state.teams.find(t => t.id === oppId);

      const lineup = selectLineup(state.squad);
      const tactic = TACTICS[pendingTactic];
      const counter = getCounterMultipliers(pendingTactic, opp.style);
      const atkPool = lineup.filter(p => p.pos === 'MID' || p.pos === 'ATT');
      const defPool = lineup.filter(p => p.pos === 'GK' || p.pos === 'DEF');
      const formMult = 1 + state.form * 0.015;
      const attackPower = atkPool.length
        ? (atkPool.reduce((s, p) => s + effective(p), 0) / atkPool.length) * tactic.attack * counter.attack * formMult
        : 30;
      const defensePower = defPool.length
        ? (defPool.reduce((s, p) => s + effective(p), 0) / defPool.length) * tactic.defense * counter.defense * formMult
        : 30;

      const oppVar = opp.strength + randInt(-4, 4);
      const home = ajaxIsHome ? HOME_ADV : -HOME_ADV * 0.5;
      const expAjax = clamp(1.3 + (attackPower - oppVar) / SKILL_DIVISOR + home, 0.15, 5.5);
      const expOpp = clamp(1.3 + (oppVar - defensePower) / SKILL_DIVISOR - home, 0.15, 5.5);
      const ajaxGoals = poisson(expAjax);
      const oppGoals = poisson(expOpp);

      const scorerPool = atkPool.length ? atkPool : lineup;
      const events = [];
      for (let i = 0; i < ajaxGoals; i++) {
        const scorer = weightedPick(scorerPool);
        events.push({ minute: randInt(1, 90), side: 'ajax', text: `⚽ ${scorer.name} scoort!` });
      }
      for (let i = 0; i < oppGoals; i++) {
        events.push({ minute: randInt(1, 90), side: 'opp', text: `⚽ Doelpunt voor ${opp.name}` });
      }

      applyResult(
        ajaxIsHome ? ajax.id : opp.id,
        ajaxIsHome ? opp.id : ajax.id,
        ajaxIsHome ? ajaxGoals : oppGoals,
        ajaxIsHome ? oppGoals : ajaxGoals
      );

      matchday.forEach(([h, a]) => {
        if (h === ajax.id || a === ajax.id) return;
        const th = state.teams.find(t => t.id === h);
        const ta = state.teams.find(t => t.id === a);
        const [hg, ag] = simulateGenericMatch(th, ta);
        applyResult(h, a, hg, ag);
      });

      state.squad.forEach(p => {
        const played = lineup.includes(p);
        if (played) {
          const preFitness = p.fitness;
          const conditionBonus = state.trainingFocus === 'Conditie' ? 3 : 0;
          p.fitness = Math.max(30, p.fitness - randInt(8, 15) + conditionBonus);
          const injuryChance = preFitness < 60 ? clamp((60 - preFitness) / 250, 0, 0.3) : 0;
          if (Math.random() < injuryChance) {
            const duration = randInt(1, 3);
            p.injuredUntil = state.globalMatchCount + 1 + duration;
            events.push({ minute: randInt(1, 90), side: 'injury', text: `🤕 ${p.name} raakt geblesseerd (${duration} wedstrijden uit)` });
          }
        } else {
          p.fitness = Math.min(100, p.fitness + randInt(10, 18));
        }
      });
      events.sort((a, b) => a.minute - b.minute);
      state.globalMatchCount++;

      let budgetGained = 0;
      if (ajaxGoals > oppGoals) {
        budgetGained = 15;
        state.form = clamp(state.form + 1, -5, 5);
        state.recentForm.push('W');
      } else if (ajaxGoals === oppGoals) {
        budgetGained = 5;
        state.form = clamp(Math.trunc(state.form / 2), -5, 5);
        state.recentForm.push('D');
      } else {
        state.form = clamp(state.form - 1, -5, 5);
        state.recentForm.push('L');
      }
      state.budget += budgetGained;
      if (state.recentForm.length > 5) state.recentForm.shift();

      lastMatchResult = {
        opp, ajaxIsHome, ajaxGoals, oppGoals, events, budgetGained,
        counterActive: counter.attack > 1 || counter.defense > 1,
        homeName: ajaxIsHome ? 'Ajax' : opp.name,
        awayName: ajaxIsHome ? opp.name : 'Ajax',
        homeGoals: ajaxIsHome ? ajaxGoals : oppGoals,
        awayGoals: ajaxIsHome ? oppGoals : ajaxGoals,
      };

      state.matchdayIndex++;
      if (state.matchdayIndex >= state.schedule.length) {
        finishSeason();
        currentView = 'seasonend';
      } else {
        currentView = 'matchresult';
      }
      save();
      render();
    }

    function weightedPick(list) {
      const total = list.reduce((s, p) => s + p.rating, 0);
      let r = Math.random() * total;
      for (const p of list) {
        r -= p.rating;
        if (r <= 0) return p;
      }
      return list[list.length - 1];
    }

    function finishSeason() {
      const table = sortedTable();
      const position = table.findIndex(t => t.isAjax) + 1;
      const achieved = position <= 3;
      if (achieved) state.goalAchieved = true;
      const bonus = position === 1 ? 800 : position === 2 ? 600 : position === 3 ? 500 : position <= 6 ? 350 : position <= 12 ? 150 : 50;
      state.budget += bonus;
      state.clPending = achieved;
      state.history.push({ season: state.season, position, achieved, bonus });
    }

    function startNewSeason() {
      state.season++;
      state.matchdayIndex = 0;
      state.form = 0;
      state.recentForm = [];
      state.clPending = false;
      state.clRun = null;
      state.teams = state.teams.map(t => {
        const drifted = clamp(t.strength + randInt(-2, 3), 50, 92);
        return freshTableRow({ id: t.id, name: t.name, strength: drifted, isAjax: t.isAjax, style: randomStyle() });
      });
      const order = state.teams.map(t => t.id).sort(() => Math.random() - 0.5);
      const ajaxIdIdx = order.indexOf('ajx');
      order.splice(ajaxIdIdx, 1);
      order.unshift('ajx');
      state.schedule = generateSchedule(order);
      state.squad.forEach(p => {
        p.fitness = 100;
        p.rested = false;
        p.injuredUntil = -1;
        let driftMin = -2, driftMax = 3;
        const isAttackGroup = p.pos === 'MID' || p.pos === 'ATT';
        const isDefenseGroup = p.pos === 'GK' || p.pos === 'DEF';
        if (state.trainingFocus === 'Aanval' && isAttackGroup) { driftMin = -1; driftMax = 4; }
        if (state.trainingFocus === 'Verdediging' && isDefenseGroup) { driftMin = -1; driftMax = 4; }
        p.rating = clamp(p.rating + randInt(driftMin, driftMax), 45, 95);
      });
      state.transferList = generateTransferCandidates(state);
      currentView = 'dashboard';
      save();
      render();
    }

    function setTrainingFocus(f) {
      state.trainingFocus = f;
      save();
      render();
    }

    function buyPlayer(id) {
      const idx = state.transferList.findIndex(c => c.id === id);
      if (idx === -1) return;
      const c = state.transferList[idx];
      if (state.budget < c.price || state.squad.length >= 24) return;
      state.budget -= c.price;
      state.squad.push({ id: state.nextPlayerId++, name: c.name, pos: c.pos, rating: c.rating, fitness: 100, rested: false, injuredUntil: -1 });
      state.transferList.splice(idx, 1);
      save();
      render();
    }

    function sellPlayer(id) {
      const p = state.squad.find(pl => pl.id === id);
      if (!p) return;
      const poolCount = state.squad.filter(q => q.pos === p.pos).length;
      if (poolCount <= POS_NEED[p.pos]) return;
      const value = Math.round(p.rating * 6);
      state.budget += value;
      state.squad = state.squad.filter(pl => pl.id !== id);
      save();
      render();
    }

    // ---------- Champions League ----------
    function generateGroupSchedule(teamIds) {
      // teamIds[0] must be Ajax's id; the circle method keeps it fixed, so it
      // only ever collides with the BYE slot, never sits out any real match unfairly.
      let ids = teamIds.slice();
      if (ids.length % 2 !== 0) ids.push('BYE');
      const n = ids.length;
      let arr = ids.slice();
      const rounds = [];
      for (let r = 0; r < n - 1; r++) {
        const round = [];
        for (let i = 0; i < n / 2; i++) {
          const home = arr[i], away = arr[n - 1 - i];
          if (home !== 'BYE' && away !== 'BYE') round.push(r % 2 === 0 ? [home, away] : [away, home]);
        }
        rounds.push(round);
        const fixed = arr[0];
        const rest = arr.slice(1);
        rest.unshift(rest.pop());
        arr = [fixed, ...rest];
      }
      return rounds;
    }

    function simulatePenalties(myPower, oppPower) {
      const myProb = clamp(0.75 + (myPower - oppPower) / 400, 0.6, 0.85);
      const oppProb = clamp(0.75 - (myPower - oppPower) / 400, 0.6, 0.85);
      let myScore = 0, oppScore = 0;
      for (let i = 0; i < 5; i++) {
        if (Math.random() < myProb) myScore++;
        if (Math.random() < oppProb) oppScore++;
      }
      let safety = 0;
      while (myScore === oppScore && safety < 10) {
        if (Math.random() < myProb) myScore++;
        if (Math.random() < oppProb) oppScore++;
        safety++;
      }
      if (myScore === oppScore) myScore++;
      return { win: myScore > oppScore, myScore, oppScore };
    }

    function resolveAIKnockout(teamA, teamB) {
      const [ga, gb] = simulateGenericMatch(teamA, teamB);
      if (ga !== gb) return ga > gb ? teamA : teamB;
      const pAWin = clamp(0.5 + (teamA.strength - teamB.strength) / 200, 0.3, 0.7);
      return Math.random() < pAWin ? teamA : teamB;
    }

    function clSortedTable() {
      return state.clRun.teams.slice().sort((a, b) =>
        (b.pts - a.pts) || ((b.gf - b.ga) - (a.gf - a.ga)) || (b.gf - a.gf)
      );
    }

    function clApplyResult(homeId, awayId, hg, ag) {
      const home = state.clRun.teams.find(t => t.id === homeId);
      const away = state.clRun.teams.find(t => t.id === awayId);
      home.played++; away.played++;
      home.gf += hg; home.ga += ag;
      away.gf += ag; away.ga += hg;
      if (hg > ag) { home.won++; away.lost++; home.pts += 3; }
      else if (hg < ag) { away.won++; home.lost++; away.pts += 3; }
      else { home.draw++; away.draw++; home.pts++; away.pts++; }
    }

    function startChampionsLeague() {
      const opponents = CL_CLUBS.map(c => freshTableRow({ ...c, isAjax: false, style: randomStyle() }));
      const ajaxEntry = freshTableRow({ id: 'ajx', name: 'Ajax', strength: null, isAjax: true, style: 'Gebalanceerd' });
      const teams = [ajaxEntry, ...opponents];
      state.clRun = {
        stage: 'group',
        teams,
        schedule: generateGroupSchedule(teams.map(t => t.id)),
        roundIndex: 0,
        bracket: null,
      };
      currentView = 'cl-dashboard';
      clAdvanceToNextAjaxRound();
      save();
      render();
    }

    function clFindAjaxFixture(round) {
      return round.find(([h, a]) => h === 'ajx' || a === 'ajx') || null;
    }

    function clAdvanceToNextAjaxRound() {
      const cl = state.clRun;
      if (!cl || cl.stage !== 'group') return;
      while (cl.roundIndex < cl.schedule.length) {
        const round = cl.schedule[cl.roundIndex];
        if (clFindAjaxFixture(round)) return;
        round.forEach(([h, a]) => {
          const th = cl.teams.find(t => t.id === h), ta = cl.teams.find(t => t.id === a);
          const [hg, ag] = simulateGenericMatch(th, ta);
          clApplyResult(h, a, hg, ag);
        });
        cl.roundIndex++;
      }
      clFinalizeGroupStage();
    }

    function clFinalizeGroupStage() {
      const table = clSortedTable();
      const top4 = table.slice(0, 4);
      const ajaxRank = top4.findIndex(t => t.isAjax);
      if (ajaxRank === -1) {
        clFinishRun('Groepsfase', CL_BONUS.group);
        return;
      }
      const seedPairs = [[top4[0].id, top4[3].id], [top4[1].id, top4[2].id]];
      const ajaxPair = seedPairs.find(p => p.includes('ajx'));
      const otherPair = seedPairs.find(p => p !== ajaxPair);
      const ajaxOppId = ajaxPair[0] === 'ajx' ? ajaxPair[1] : ajaxPair[0];
      const oa = state.clRun.teams.find(t => t.id === otherPair[0]);
      const ob = state.clRun.teams.find(t => t.id === otherPair[1]);
      const otherWinner = resolveAIKnockout(oa, ob);
      state.clRun.stage = 'semifinal';
      state.clRun.bracket = { ajaxOppId, otherFinalistId: otherWinner.id, ajaxSeed: ajaxRank + 1 };
      currentView = 'cl-dashboard';
    }

    function clFinishRun(resultLabel, bonus) {
      state.budget += bonus;
      const last = state.history[state.history.length - 1];
      if (last) { last.clResult = resultLabel; last.clBonus = bonus; }
      state.clRun = null;
      state.clPending = false;
      lastClFinalSummary = { resultLabel, bonus };
      currentView = 'cl-final';
      save();
      render();
    }

    function clCurrentFixture() {
      const cl = state.clRun;
      if (!cl) return null;
      if (cl.stage === 'group') {
        const round = cl.schedule[cl.roundIndex];
        const fx = round ? clFindAjaxFixture(round) : null;
        if (!fx) return null;
        const isHome = fx[0] === 'ajx';
        const oppId = isHome ? fx[1] : fx[0];
        const ajaxEntry = cl.teams.find(t => t.isAjax);
        return { oppId, isHome, stage: 'group', label: `Groepswedstrijd ${ajaxEntry.played + 1} van 8` };
      }
      if (cl.stage === 'semifinal') {
        return { oppId: cl.bracket.ajaxOppId, isHome: cl.bracket.ajaxSeed <= 2, stage: 'semifinal', label: 'Halve finale' };
      }
      if (cl.stage === 'final') {
        return { oppId: cl.bracket.finalOpponentId, isHome: true, stage: 'final', label: 'Finale' };
      }
      return null;
    }

    function clPlayMatch(oppId, ajaxIsHome, stage) {
      const opp = state.clRun.teams.find(t => t.id === oppId);
      const lineup = selectLineup(state.squad);
      const tactic = TACTICS[pendingTactic];
      const counter = getCounterMultipliers(pendingTactic, opp.style);
      const atkPool = lineup.filter(p => p.pos === 'MID' || p.pos === 'ATT');
      const defPool = lineup.filter(p => p.pos === 'GK' || p.pos === 'DEF');
      const formMult = 1 + state.form * 0.015;
      const attackPower = atkPool.length
        ? (atkPool.reduce((s, p) => s + effective(p), 0) / atkPool.length) * tactic.attack * counter.attack * formMult
        : 30;
      const defensePower = defPool.length
        ? (defPool.reduce((s, p) => s + effective(p), 0) / defPool.length) * tactic.defense * counter.defense * formMult
        : 30;

      const oppVar = opp.strength + randInt(-4, 4);
      const home = stage === 'final' ? 0 : (ajaxIsHome ? HOME_ADV : -HOME_ADV * 0.5);
      const expAjax = clamp(1.3 + (attackPower - oppVar) / SKILL_DIVISOR + home, 0.15, 5.5);
      const expOpp = clamp(1.3 + (oppVar - defensePower) / SKILL_DIVISOR - home, 0.15, 5.5);
      let ajaxGoals = poisson(expAjax);
      let oppGoals = poisson(expOpp);

      const scorerPool = atkPool.length ? atkPool : lineup;
      const events = [];
      const addGoals = (n, side, range) => {
        for (let i = 0; i < n; i++) {
          if (side === 'ajax') {
            const scorer = weightedPick(scorerPool);
            events.push({ minute: randInt(range[0], range[1]), side: 'ajax', text: `⚽ ${scorer.name} scoort!` });
          } else {
            events.push({ minute: randInt(range[0], range[1]), side: 'opp', text: `⚽ Doelpunt voor ${opp.name}` });
          }
        }
      };
      addGoals(ajaxGoals, 'ajax', [1, 90]);
      addGoals(oppGoals, 'opp', [1, 90]);

      const isKnockout = stage === 'semifinal' || stage === 'final';
      let wentToExtraTime = false, wentToPenalties = false, penaltyResult = null;
      if (isKnockout && ajaxGoals === oppGoals) {
        wentToExtraTime = true;
        const etAjax = poisson(expAjax / 3);
        const etOpp = poisson(expOpp / 3);
        addGoals(etAjax, 'ajax', [91, 120]);
        addGoals(etOpp, 'opp', [91, 120]);
        ajaxGoals += etAjax; oppGoals += etOpp;
        if (ajaxGoals === oppGoals) {
          wentToPenalties = true;
          penaltyResult = simulatePenalties(attackPower + defensePower, opp.strength * 2);
        }
      }
      events.sort((a, b) => a.minute - b.minute);

      state.squad.forEach(p => {
        const played = lineup.includes(p);
        if (played) {
          const preFitness = p.fitness;
          const conditionBonus = state.trainingFocus === 'Conditie' ? 3 : 0;
          p.fitness = Math.max(30, p.fitness - randInt(8, 15) + conditionBonus);
          const injuryChance = preFitness < 60 ? clamp((60 - preFitness) / 250, 0, 0.3) : 0;
          if (Math.random() < injuryChance) {
            const duration = randInt(1, 3);
            p.injuredUntil = state.globalMatchCount + 1 + duration;
            events.push({ minute: randInt(1, 90), side: 'injury', text: `🤕 ${p.name} raakt geblesseerd (${duration} wedstrijden uit)` });
          }
        } else {
          p.fitness = Math.min(100, p.fitness + randInt(10, 18));
        }
      });
      events.sort((a, b) => a.minute - b.minute);
      state.globalMatchCount++;

      const ajaxWonMatch = wentToPenalties ? penaltyResult.win : ajaxGoals > oppGoals;
      const isDrawNonKnockout = !isKnockout && ajaxGoals === oppGoals;
      if (ajaxWonMatch && !isDrawNonKnockout) {
        state.form = clamp(state.form + 1, -5, 5); state.recentForm.push('W');
      } else if (isDrawNonKnockout) {
        state.form = clamp(Math.trunc(state.form / 2), -5, 5); state.recentForm.push('D');
      } else {
        state.form = clamp(state.form - 1, -5, 5); state.recentForm.push('L');
      }
      if (state.recentForm.length > 5) state.recentForm.shift();

      lastClMatchResult = {
        opp, stage, ajaxIsHome, ajaxGoals, oppGoals, events, ajaxWonMatch,
        counterActive: counter.attack > 1 || counter.defense > 1,
        wentToExtraTime, wentToPenalties, penaltyResult,
        homeName: ajaxIsHome ? 'Ajax' : opp.name,
        awayName: ajaxIsHome ? opp.name : 'Ajax',
        homeGoals: ajaxIsHome ? ajaxGoals : oppGoals,
        awayGoals: ajaxIsHome ? oppGoals : ajaxGoals,
      };

      if (stage === 'group') {
        clApplyResult(
          ajaxIsHome ? 'ajx' : oppId,
          ajaxIsHome ? oppId : 'ajx',
          ajaxIsHome ? ajaxGoals : oppGoals,
          ajaxIsHome ? oppGoals : ajaxGoals
        );
        const round = state.clRun.schedule[state.clRun.roundIndex];
        round.forEach(([h, a]) => {
          if (h === 'ajx' || a === 'ajx') return;
          const th = state.clRun.teams.find(t => t.id === h), ta = state.clRun.teams.find(t => t.id === a);
          const [hg, ag] = simulateGenericMatch(th, ta);
          clApplyResult(h, a, hg, ag);
        });
        state.clRun.roundIndex++;
      }

      currentView = 'cl-matchresult';
      save();
      render();
    }

    function clContinueAfterMatch() {
      const r = lastClMatchResult;
      if (!r) { goTo('cl-dashboard'); return; }
      if (r.stage === 'group') {
        clAdvanceToNextAjaxRound();
        if (state.clRun) currentView = 'cl-dashboard';
      } else if (r.stage === 'semifinal') {
        if (r.ajaxWonMatch) {
          state.clRun.stage = 'final';
          state.clRun.bracket.finalOpponentId = state.clRun.bracket.otherFinalistId;
          currentView = 'cl-dashboard';
        } else {
          clFinishRun('Halve finale', CL_BONUS.semifinal);
          return;
        }
      } else if (r.stage === 'final') {
        if (r.ajaxWonMatch) clFinishRun('Kampioen! 🏆', CL_BONUS.winner);
        else clFinishRun('Finalist', CL_BONUS.finalist);
        return;
      }
      save();
      render();
    }

    // ---------- rendering ----------
    function render() {
      const app = document.getElementById('app');
      app.innerHTML = tabsHtml() + viewHtml();
    }

    function tabsHtml() {
      const tabs = [
        ['dashboard', 'Overzicht'],
        ['squad', 'Selectie'],
        ['table', 'Stand'],
        ['transfer', 'Transfermarkt'],
      ];
      if (state.clRun) tabs.push(['cl-dashboard', 'Champions League']);
      const clViews = ['cl-dashboard', 'cl-match', 'cl-matchresult'];
      return `<div class="tabs">${tabs.map(([id, label]) => {
        const active = currentView === id || (id === 'cl-dashboard' && clViews.includes(currentView));
        return `<button class="${active ? 'active' : ''}" onclick="goTo('${id}')">${label}</button>`;
      }).join('')}</div>`;
    }

    function goTo(view) { currentView = view; render(); }

    function viewHtml() {
      if (currentView === 'squad') return squadHtml();
      if (currentView === 'table') return tableHtml();
      if (currentView === 'transfer') return transferHtml();
      if (currentView === 'match') return matchPrepHtml();
      if (currentView === 'matchresult') return matchResultHtml();
      if (currentView === 'seasonend') return seasonEndHtml();
      if (currentView === 'cl-dashboard') return clDashboardHtml();
      if (currentView === 'cl-match') return clMatchPrepHtml();
      if (currentView === 'cl-matchresult') return clMatchResultHtml();
      if (currentView === 'cl-final') return clFinalHtml();
      return dashboardHtml();
    }

    function formLabel(f) {
      if (f >= 3) return '🔥 Uitstekende vorm';
      if (f >= 1) return '📈 Goede vorm';
      if (f <= -3) return '🥶 Slechte vorm';
      if (f <= -1) return '📉 Matige vorm';
      return '➖ Neutrale vorm';
    }

    function dashboardHtml() {
      const ajax = ajaxTeam();
      const table = sortedTable();
      const position = table.findIndex(t => t.isAjax) + 1;
      const totalMd = state.schedule.length;
      const md = state.matchdayIndex;

      let goalLine = state.goalAchieved
        ? `<div class="banner success">🏆 Ajax heeft Champions League-voetbal bereikt (seizoen behaald in het verleden)!</div>`
        : '';

      let mainAction;
      if (md >= totalMd) {
        mainAction = `<button class="btn" onclick="goTo('seasonend')">Bekijk seizoensafsluiting</button>`;
      } else {
        const fixture = state.schedule[md];
        const ajaxFx = fixture.find(([h, a]) => h === ajax.id || a === ajax.id);
        const ajaxIsHome = ajaxFx[0] === ajax.id;
        const oppId = ajaxIsHome ? ajaxFx[1] : ajaxFx[0];
        const opp = state.teams.find(t => t.id === oppId);
        mainAction = `
          <div class="fixture">
            <div class="vs">${ajaxIsHome ? 'Ajax' : opp.name} vs ${ajaxIsHome ? opp.name : 'Ajax'}</div>
            <div class="venue">${ajaxIsHome ? 'Thuis' : 'Uit'} · speelronde ${md + 1} van ${totalMd}</div>
          </div>
          <div class="actions">
            <button class="btn" onclick="goTo('match')">Wedstrijd voorbereiden →</button>
          </div>`;
      }

      return `
        ${goalLine}
        <div class="card">
          <h2>Seizoen ${state.season}</h2>
          <div class="summary-grid">
            <div class="stat"><div class="label">Positie</div><div class="value">${position}e</div></div>
            <div class="stat"><div class="label">Punten</div><div class="value">${ajax.pts}</div></div>
            <div class="stat"><div class="label">Gespeeld</div><div class="value">${ajax.played}/${totalMd}</div></div>
            <div class="stat"><div class="label">Doelsaldo</div><div class="value">${ajax.gf - ajax.ga >= 0 ? '+' : ''}${ajax.gf - ajax.ga}</div></div>
            <div class="stat"><div class="label">Budget</div><div class="value">€${state.budget}k</div></div>
            <div class="stat"><div class="label">Vorm</div><div class="value" style="font-size:.95rem">${formLabel(state.form)}</div></div>
          </div>
          ${state.recentForm.length ? `<div class="form-badges">${state.recentForm.map(r => `<span class="${r}">${r}</span>`).join('')}</div>` : ''}
        </div>
        <div class="card">
          <h2>Doel: eindig top 3 voor Champions League-voetbal</h2>
          <p class="muted-small">Nummer 1 t/m 3 plaatsen zich voor Europees CL-voetbal. Plek 4-6 geeft Europa League / Conference League.</p>
          ${mainAction}
        </div>
        ${state.history.length ? historyCardHtml() : ''}
        <div class="actions">
          <button class="btn secondary" onclick="resetGame()">Nieuw spel</button>
        </div>
      `;

    function historyCardHtml() {
      return `
        <div class="card">
          <h2>Seizoensgeschiedenis</h2>
          <ul class="history-list">
            ${state.history.slice().reverse().map(h =>
              `<li><span>Seizoen ${h.season}</span><span>${h.position}e plaats ${h.achieved ? '🏆' : ''} (+€${h.bonus}k)${h.clResult ? ` · CL: ${h.clResult} (+€${h.clBonus}k)` : ''}</span></li>`
            ).join('')}
          </ul>
        </div>
      `;
    }

    function squadHtml() {
      const order = { GK: 'Doel', DEF: 'Verdediging', MID: 'Middenveld', ATT: 'Aanval' };
      return `
        <div class="card">
          <h2>Selectie & fitheid</h2>
          <p class="muted-small">Laat spelers rusten om fitheid te sparen. Speel je een speler te vaak uitgeput, dan loopt hij risico op een blessure.</p>
          ${Object.keys(order).map(pos => {
            const healthyCount = state.squad.filter(p => p.pos === pos && isAvailable(p)).length;
            return `
            <h3>${order[pos]}</h3>
            ${healthyCount < POS_NEED[pos] ? `<p class="warn-text">⚠️ Te weinig fitte spelers beschikbaar in deze linie!</p>` : ''}
            ${state.squad.filter(p => p.pos === pos).sort((a,b) => b.rating - a.rating).map(p => {
              const injured = !isAvailable(p);
              if (injured) {
                const remaining = p.injuredUntil - state.globalMatchCount;
                return `
                  <div class="player-row injured">
                    <span class="pos-badge">${pos}</span>
                    <span class="name">${p.name}</span>
                    <span class="rating">${p.rating}</span>
                    <span class="injury-tag">🤕 nog ${remaining} wedstrijd${remaining === 1 ? '' : 'en'}</span>
                  </div>`;
              }
              return `
                <div class="player-row ${p.rested ? 'rested' : ''}">
                  <span class="pos-badge">${pos}</span>
                  <span class="name">${p.name}</span>
                  <span class="rating">${p.rating}</span>
                  <div class="fitness-bar"><i style="width:${p.fitness}%; background:${p.fitness > 60 ? '#10b981' : p.fitness > 35 ? '#f59e0b' : '#ef4444'}"></i></div>
                  <label><input type="checkbox" ${p.rested ? 'checked' : ''} onchange="toggleRest(${p.id})" ${(!p.rested && restedCountAvailable(pos) <= 0) ? 'disabled' : ''}> rust</label>
                </div>`;
            }).join('')}
          `;
          }).join('')}
        </div>
      `;
    }

    function tableHtml() {
      const rows = sortedTable();
      return `
        <div class="card">
          <h2>Eredivisie stand — seizoen ${state.season}</h2>
          <div style="overflow-x:auto">
          <table class="league">
            <thead><tr>
              <th>#</th><th style="text-align:left">Club</th><th>W</th><th>G</th><th>V</th><th>P</th><th>DS</th><th>D</th><th>Pt</th>
            </tr></thead>
            <tbody>
              ${rows.map((t, i) => {
                const pos = i + 1;
                const zone = pos <= 3 ? 'zone-cl' : pos <= 6 ? 'zone-eu' : pos >= rows.length - 2 ? 'zone-degr' : '';
                return `<tr class="${t.isAjax ? 'ajax-row' : ''} ${zone}">
                  <td class="pos">${pos}</td>
                  <td class="club">${t.name}</td>
                  <td>${t.won}</td>
                  <td>${t.draw}</td>
                  <td>${t.lost}</td>
                  <td>${t.played}</td>
                  <td>${t.gf - t.ga}</td>
                  <td>${t.gf}-${t.ga}</td>
                  <td><strong>${t.pts}</strong></td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>
          </div>
          <div class="legend">
            <span><i style="background:#10b981"></i> Champions League</span>
            <span><i style="background:#f59e0b"></i> Europa / Conference League</span>
            <span><i style="background:#ef4444"></i> Degradatiezone</span>
          </div>
        </div>
      `;
    }

    function trainingDesc(f) {
      if (f === 'Aanval') return 'Middenveld en aanvallers ontwikkelen sneller bij het volgende seizoen.';
      if (f === 'Verdediging') return 'Keeper en verdedigers ontwikkelen sneller bij het volgende seizoen.';
      return 'Minder vermoeidheidsverlies per wedstrijd, dit hele seizoen.';
    }

    function transferHtml() {
      return `
        <div class="card">
          <h2>Transferbudget: €${state.budget}k</h2>
          <p class="muted-small">Verdien budget met overwinningen (+€15k), gelijke spelen (+€5k) en een goede eindnotering.</p>
        </div>
        <div class="card">
          <h2>Trainingsfocus</h2>
          <div class="tactic-options">
            ${['Aanval', 'Verdediging', 'Conditie'].map(f => `
              <label>
                <input type="radio" name="training" value="${f}" ${state.trainingFocus === f ? 'checked' : ''} onchange="setTrainingFocus('${f}')">
                <span class="t-name">${f}</span>
                <span class="t-desc">${trainingDesc(f)}</span>
              </label>
            `).join('')}
          </div>
        </div>
        <div class="card">
          <h2>Beschikbare spelers</h2>
          ${state.transferList.length ? state.transferList.map(c => `
            <div class="player-row">
              <span class="pos-badge">${c.pos}</span>
              <span class="name">${c.name}</span>
              <span class="rating">${c.rating}</span>
              <span class="value">€${c.price}k</span>
              <button class="btn secondary small-btn" onclick="buyPlayer(${c.id})" ${(state.budget < c.price || state.squad.length >= 24) ? 'disabled' : ''}>Koop</button>
            </div>
          `).join('') : '<p class="muted-small">Geen spelers meer beschikbaar dit seizoen.</p>'}
        </div>
        <div class="card">
          <h2>Selectie verkopen</h2>
          ${Object.keys(POS_NEED).map(pos => `
            ${state.squad.filter(p => p.pos === pos).sort((a,b) => b.rating - a.rating).map(p => {
              const poolCount = state.squad.filter(q => q.pos === pos).length;
              const canSell = poolCount > POS_NEED[pos];
              const value = Math.round(p.rating * 6);
              return `
                <div class="player-row">
                  <span class="pos-badge">${pos}</span>
                  <span class="name">${p.name}</span>
                  <span class="rating">${p.rating}</span>
                  <span class="value">€${value}k</span>
                  <button class="btn secondary small-btn" onclick="sellPlayer(${p.id})" ${canSell ? '' : 'disabled'}>Verkoop</button>
                </div>`;
            }).join('')}
          `).join('')}
        </div>
      `;
    }

    function matchPrepHtml() {
      const ajax = ajaxTeam();
      const fixture = state.schedule[state.matchdayIndex];
      const ajaxFx = fixture.find(([h, a]) => h === ajax.id || a === ajax.id);
      const ajaxIsHome = ajaxFx[0] === ajax.id;
      const oppId = ajaxIsHome ? ajaxFx[1] : ajaxFx[0];
      const opp = state.teams.find(t => t.id === oppId);
      const avgFitness = Math.round(state.squad.reduce((s, p) => s + p.fitness, 0) / state.squad.length);
      const counter = getCounterMultipliers(pendingTactic, opp.style);
      const counterActive = counter.attack > 1 || counter.defense > 1;

      return `
        <div class="card">
          <h2>Speelronde ${state.matchdayIndex + 1} van ${state.schedule.length}</h2>
          <div class="fixture">
            <div class="vs">${ajaxIsHome ? 'Ajax' : opp.name} vs ${ajaxIsHome ? opp.name : 'Ajax'}</div>
            <div class="venue">${ajaxIsHome ? 'Thuis' : 'Uit'} · tegenstander sterkte ${opp.strength}</div>
          </div>
          <p class="scouting">Scouting: ${opp.name} speelt doorgaans <strong>${opp.style}</strong>.
            ${counterActive ? `<span class="counter-tag">Jouw tactiek countert dit! ✅</span>` : 'Tip: verdedigend counter je een aanvallende tegenstander, aanvallend counter je een verdedigende tegenstander.'}
          </p>
          <p class="muted-small">Gemiddelde fitheid selectie: ${avgFitness}%</p>
          <h3>Kies je tactiek</h3>
          <div class="tactic-options">
            ${Object.keys(TACTICS).map(name => `
              <label>
                <input type="radio" name="tactic" value="${name}" ${pendingTactic === name ? 'checked' : ''} onchange="pendingTactic='${name}'; render()">
                <span class="t-name">${name}</span>
                <span class="t-desc">${TACTICS[name].desc}</span>
              </label>
            `).join('')}
          </div>
          <div class="actions">
            <button class="btn" onclick="playMatchday()">Speel wedstrijd ▶</button>
            <button class="btn secondary" onclick="goTo('squad')">Selectie bekijken</button>
          </div>
        </div>
      `;
    }

    function matchResultHtml() {
      const r = lastMatchResult;
      return `
        <div class="card">
          <h2>Wedstrijdverslag</h2>
          <div class="score">
            ${r.homeGoals} - ${r.awayGoals}
            <span class="team-name">${r.homeName} — ${r.awayName}</span>
          </div>
          ${r.counterActive ? `<p class="scouting counter-tag" style="text-align:center">Je tactiek countertte de speelstijl van ${r.opp.name}! ✅</p>` : ''}
          <ul class="events">
            ${r.events.length ? r.events.map(e => `<li class="${e.side === 'ajax' ? 'home' : e.side === 'injury' ? 'injury' : ''}"><span class="min">${e.minute}'</span>${e.text}</li>`).join('') : '<li>Doelpuntloos gelijkspel.</li>'}
          </ul>
          <p class="muted-small" style="text-align:center">Budget: +€${r.budgetGained}k &nbsp;·&nbsp; Vorm: ${formLabel(state.form)}</p>
          <div class="actions">
            <button class="btn" onclick="goTo('dashboard')">Verder →</button>
            <button class="btn secondary" onclick="goTo('table')">Bekijk stand</button>
          </div>
        </div>
      `;
    }

    function seasonEndHtml() {
      const table = sortedTable();
      const position = table.findIndex(t => t.isAjax) + 1;
      const achieved = position <= 3;
      const lastEntry = state.history[state.history.length - 1];
      const bonus = lastEntry?.bonus ?? 0;
      return `
        <div class="banner ${achieved ? 'success' : 'fail'}">
          ${achieved
            ? `🏆 Gefeliciteerd! Ajax eindigde ${position}e en is geplaatst voor de Champions League!`
            : `Ajax eindigde ${position}e — net niet genoeg voor Champions League-voetbal. Volgend seizoen beter!`}
        </div>
        ${lastEntry?.clResult ? `<div class="banner success">Champions League: ${lastEntry.clResult} (+€${lastEntry.clBonus}k)</div>` : ''}
        <div class="card">
          <h2>Eindstand seizoen ${state.season}</h2>
          <p class="muted-small">Prijzengeld voor deze eindnotering: +€${bonus}k. Nieuw budget: €${state.budget}k.</p>
          <div style="overflow-x:auto">
          <table class="league">
            <thead><tr><th>#</th><th style="text-align:left">Club</th><th>P</th><th>D</th><th>Pt</th></tr></thead>
            <tbody>
              ${table.map((t, i) => `<tr class="${t.isAjax ? 'ajax-row' : ''}">
                <td>${i + 1}</td><td class="club">${t.name}</td><td>${t.played}</td><td>${t.gf - t.ga}</td><td><strong>${t.pts}</strong></td>
              </tr>`).join('')}
            </tbody>
          </table>
          </div>
        </div>
        <div class="actions">
          ${state.clPending ? `<button class="btn" onclick="startChampionsLeague()">Speel Champions League →</button>` : ''}
          <button class="btn ${state.clPending ? 'secondary' : ''}" onclick="startNewSeason()">Start seizoen ${state.season + 1} →</button>
          <button class="btn secondary" onclick="goTo('transfer')">Naar transfermarkt</button>
          <button class="btn secondary" onclick="resetGame()">Nieuw spel</button>
        </div>
      `;
    }

    function clDashboardHtml() {
      const cl = state.clRun;
      if (!cl) return `<div class="card"><p class="muted-small">Geen actief Champions League-toernooi.</p></div>`;
      let statusHtml = '';
      if (cl.stage === 'group') {
        const table = clSortedTable();
        statusHtml = `
          <div class="card">
            <h2>Champions League — Groepsfase</h2>
            <div style="overflow-x:auto">
            <table class="league">
              <thead><tr><th>#</th><th style="text-align:left">Club</th><th>P</th><th>D</th><th>Pt</th></tr></thead>
              <tbody>
                ${table.map((t, i) => `<tr class="${t.isAjax ? 'ajax-row' : ''} ${i < 4 ? 'zone-cl' : ''}">
                  <td class="pos">${i + 1}</td><td class="club">${t.name}</td><td>${t.played}</td><td>${t.gf - t.ga}</td><td><strong>${t.pts}</strong></td>
                </tr>`).join('')}
              </tbody>
            </table>
            </div>
            <p class="muted-small">Top 4 plaatst zich voor de knock-outfase (halve finale, finale).</p>
          </div>`;
      } else {
        const oppId = cl.stage === 'semifinal' ? cl.bracket.ajaxOppId : cl.bracket.finalOpponentId;
        const opp = cl.teams.find(t => t.id === oppId);
        statusHtml = `
          <div class="card">
            <h2>Champions League — ${cl.stage === 'semifinal' ? 'Halve finale' : 'Finale'}</h2>
            <p class="muted-small">Tegenstander: ${opp.name} (sterkte ${opp.strength}).${cl.stage === 'final' ? ' Gespeeld op neutraal terrein.' : ''}</p>
          </div>`;
      }
      return `
        ${statusHtml}
        <div class="actions">
          <button class="btn" onclick="goTo('cl-match')">Wedstrijd voorbereiden →</button>
        </div>
      `;
    }

    function clMatchPrepHtml() {
      const fx = clCurrentFixture();
      if (!fx) return clDashboardHtml();
      const opp = state.clRun.teams.find(t => t.id === fx.oppId);
      const avgFitness = Math.round(state.squad.reduce((s, p) => s + p.fitness, 0) / state.squad.length);
      const counter = getCounterMultipliers(pendingTactic, opp.style);
      const counterActive = counter.attack > 1 || counter.defense > 1;
      return `
        <div class="card">
          <h2>${fx.label}</h2>
          <div class="fixture">
            <div class="vs">${fx.isHome ? 'Ajax' : opp.name} vs ${fx.isHome ? opp.name : 'Ajax'}</div>
            <div class="venue">${fx.stage === 'final' ? 'Neutraal terrein' : (fx.isHome ? 'Thuis' : 'Uit')} · tegenstander sterkte ${opp.strength}</div>
          </div>
          <p class="scouting">Scouting: ${opp.name} speelt doorgaans <strong>${opp.style}</strong>.
            ${counterActive ? `<span class="counter-tag">Jouw tactiek countert dit! ✅</span>` : 'Tip: verdedigend counter je een aanvallende tegenstander, aanvallend counter je een verdedigende tegenstander.'}
          </p>
          <p class="muted-small">Gemiddelde fitheid selectie: ${avgFitness}%${fx.stage !== 'group' ? ' · Bij gelijkspel volgt verlenging en eventueel strafschoppen.' : ''}</p>
          <h3>Kies je tactiek</h3>
          <div class="tactic-options">
            ${Object.keys(TACTICS).map(name => `
              <label>
                <input type="radio" name="tactic" value="${name}" ${pendingTactic === name ? 'checked' : ''} onchange="pendingTactic='${name}'; render()">
                <span class="t-name">${name}</span>
                <span class="t-desc">${TACTICS[name].desc}</span>
              </label>
            `).join('')}
          </div>
          <div class="actions">
            <button class="btn" onclick="clPlayMatch('${fx.oppId}', ${fx.isHome}, '${fx.stage}')">Speel wedstrijd ▶</button>
            <button class="btn secondary" onclick="goTo('squad')">Selectie bekijken</button>
          </div>
        </div>
      `;
    }

    function clMatchResultHtml() {
      const r = lastClMatchResult;
      if (!r) return clDashboardHtml();
      let extraLine = '';
      if (r.wentToPenalties) {
        extraLine = `<p class="muted-small" style="text-align:center">Na verlenging gelijk — strafschoppen: ${r.penaltyResult.myScore}-${r.penaltyResult.oppScore} ${r.ajaxWonMatch ? 'in het voordeel van Ajax! ✅' : `in het voordeel van ${r.opp.name}.`}</p>`;
      } else if (r.wentToExtraTime) {
        extraLine = `<p class="muted-small" style="text-align:center">Beslist na verlenging.</p>`;
      }
      return `
        <div class="card">
          <h2>${r.stage === 'group' ? 'Groepswedstrijd' : r.stage === 'semifinal' ? 'Halve finale' : 'Finale'}</h2>
          <div class="score">
            ${r.homeGoals} - ${r.awayGoals}
            <span class="team-name">${r.homeName} — ${r.awayName}</span>
          </div>
          ${extraLine}
          ${r.counterActive ? `<p class="scouting counter-tag" style="text-align:center">Je tactiek countertte de speelstijl van ${r.opp.name}! ✅</p>` : ''}
          <ul class="events">
            ${r.events.length ? r.events.map(e => `<li class="${e.side === 'ajax' ? 'home' : e.side === 'injury' ? 'injury' : ''}"><span class="min">${e.minute}'</span>${e.text}</li>`).join('') : '<li>Doelpuntloos gelijkspel.</li>'}
          </ul>
          <div class="actions">
            <button class="btn" onclick="clContinueAfterMatch()">Verder →</button>
          </div>
        </div>
      `;
    }

    function clFinalHtml() {
      const s = lastClFinalSummary;
      if (!s) return dashboardHtml();
      const isWinner = s.resultLabel.includes('Kampioen');
      return `
        <div class="banner success">
          ${isWinner ? '🏆🏆 Ajax is Champions League-winnaar!' : `Champions League-avontuur geëindigd: ${s.resultLabel}.`}
        </div>
        <div class="card">
          <p class="muted-small">Bonus: +€${s.bonus}k. Nieuw budget: €${state.budget}k.</p>
          <div class="actions">
            <button class="btn" onclick="goTo('seasonend')">Terug naar seizoensafsluiting</button>
          </div>
        </div>
      `;
    }

    render();
  </script>
</body>
</html>

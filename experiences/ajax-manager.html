<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ajax Manager</title>
  <link rel="stylesheet" href="../style.css" />
  <style>
    :root { --accent: #d2122e; }

    main.experience { max-width: 780px; }

    .card {
      background: var(--white);
      border-radius: var(--radius);
      padding: 1.5rem;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
      margin-bottom: 1.25rem;
    }
    .card h2 { font-size: 1.1rem; margin-bottom: .75rem; }
    .card h3 { font-size: 1rem; margin: .75rem 0 .5rem; color: var(--muted); }

    .tabs { display: flex; gap: .5rem; margin-bottom: 1.25rem; flex-wrap: wrap; }
    .tabs button {
      border: 2px solid #e2e8f0;
      background: var(--white);
      color: var(--text);
      padding: .5rem 1rem;
      border-radius: .6rem;
      font-weight: 600;
      font-size: .85rem;
      cursor: pointer;
      transition: border-color .15s, color .15s;
    }
    .tabs button.active { border-color: var(--accent); color: var(--accent); }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: .75rem;
      text-align: center;
    }
    .summary-grid .stat {
      background: var(--bg);
      border-radius: .6rem;
      padding: .75rem .5rem;
    }
    .summary-grid .stat .label { font-size: .75rem; color: var(--muted); }
    .summary-grid .stat .value { font-size: 1.3rem; font-weight: 800; margin-top: .15rem; }

    table.league { width: 100%; border-collapse: collapse; font-size: .85rem; }
    table.league th, table.league td { padding: .45rem .4rem; text-align: center; border-bottom: 1px solid #edf1f5; }
    table.league th { color: var(--muted); font-weight: 600; font-size: .75rem; }
    table.league td.club { text-align: left; font-weight: 600; }
    table.league tr.ajax-row td { background: #fdf1f2; }
    table.league tr.ajax-row td.club { color: var(--accent); }
    table.league td.pos { position: relative; }
    table.league tr.zone-cl td.pos::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: #10b981; }
    table.league tr.zone-eu td.pos::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: #f59e0b; }
    table.league tr.zone-degr td.pos::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: #ef4444; }

    .legend { display: flex; gap: 1rem; flex-wrap: wrap; font-size: .75rem; color: var(--muted); margin-top: .75rem; }
    .legend span { display: inline-flex; align-items: center; gap: .35rem; }
    .legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }

    .player-row {
      display: flex;
      align-items: center;
      gap: .75rem;
      padding: .5rem 0;
      border-bottom: 1px solid #edf1f5;
    }
    .player-row:last-child { border-bottom: none; }
    .player-row .pos-badge {
      width: 2.2rem; height: 1.5rem;
      border-radius: .35rem;
      background: var(--bg);
      color: var(--muted);
      font-size: .7rem;
      font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .player-row .name { flex: 1; font-weight: 600; font-size: .9rem; }
    .player-row .rating { font-size: .8rem; color: var(--muted); width: 2rem; text-align: right; }
    .fitness-bar { width: 90px; height: 8px; border-radius: 4px; background: #e2e8f0; overflow: hidden; flex-shrink: 0; }
    .fitness-bar i { display: block; height: 100%; background: #10b981; }
    .player-row.rested { opacity: .5; }
    .player-row label { display: flex; align-items: center; gap: .35rem; font-size: .75rem; color: var(--muted); cursor: pointer; white-space: nowrap; }

    .tactic-options { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); gap: .75rem; margin: 1rem 0; }
    .tactic-options label {
      border: 2px solid #e2e8f0;
      border-radius: .6rem;
      padding: .75rem;
      cursor: pointer;
      display: block;
      transition: border-color .15s;
    }
    .tactic-options input { display: none; }
    .tactic-options input:checked + span { color: var(--accent); }
    .tactic-options label:has(input:checked) { border-color: var(--accent); }
    .tactic-options .t-name { font-weight: 700; display: block; margin-bottom: .25rem; }
    .tactic-options .t-desc { font-size: .78rem; color: var(--muted); }

    .fixture { text-align: center; margin: 1rem 0; }
    .fixture .vs { font-size: 1.4rem; font-weight: 800; }
    .fixture .venue { font-size: .8rem; color: var(--muted); margin-top: .25rem; }

    .score { text-align: center; font-size: 2.2rem; font-weight: 800; margin: 1rem 0; }
    .score .team-name { font-size: .95rem; font-weight: 600; color: var(--muted); display: block; margin-top: .25rem; }

    .events { list-style: none; font-size: .85rem; margin: 1rem 0; }
    .events li { padding: .35rem 0; border-bottom: 1px solid #edf1f5; display: flex; gap: .5rem; }
    .events li .min { color: var(--muted); width: 2.5rem; flex-shrink: 0; }
    .events li.home { font-weight: 600; }

    .banner {
      border-radius: .6rem;
      padding: 1rem;
      text-align: center;
      font-weight: 700;
      margin-bottom: 1rem;
    }
    .banner.success { background: #ecfdf5; color: #047857; }
    .banner.fail { background: #fef2f2; color: #b91c1c; }

    .history-list { list-style: none; font-size: .85rem; }
    .history-list li { display: flex; justify-content: space-between; padding: .35rem 0; border-bottom: 1px solid #edf1f5; }

    .actions { display: flex; gap: .75rem; flex-wrap: wrap; margin-top: 1rem; }
    .muted-small { font-size: .8rem; color: var(--muted); margin-top: .5rem; }
  </style>
</head>
<body>
  <header>
    <nav>
      <span class="logo">Ajax Manager</span>
      <a href="../index.html" class="back-link">← Terug</a>
    </nav>
  </header>

  <main class="experience">
    <h1>🔴⚪ Ajax Manager</h1>
    <div id="app"></div>
  </main>

  <script>
    const HOME_ADV = 0.35;
    const POS_NEED = { GK: 1, DEF: 4, MID: 3, ATT: 3 };
    const SAVE_KEY = 'ajax-manager-save-v1';

    let currentView = 'dashboard';
    let pendingTactic = 'Gebalanceerd';
    let lastMatchResult = null;

    const TACTICS = {
      Aanvallend:   { attack: 1.15, defense: 0.88, desc: 'Meer druk voorin, kwetsbaarder achterin.' },
      Gebalanceerd: { attack: 1.0,  defense: 1.0,  desc: 'Een neutrale, evenwichtige aanpak.' },
      Verdedigend:  { attack: 0.85, defense: 1.15, desc: 'Stevig achterin, minder scherp voorin.' },
    };

    function baseTeams() {
      return [
        { id: 'ajx', name: 'Ajax', strength: 80, isAjax: true },
        { id: 'psv', name: 'PSV', strength: 85 },
        { id: 'fey', name: 'Feyenoord', strength: 83 },
        { id: 'az',  name: 'AZ', strength: 78 },
        { id: 'twe', name: 'FC Twente', strength: 76 },
        { id: 'utr', name: 'FC Utrecht', strength: 73 },
        { id: 'hee', name: 'sc Heerenveen', strength: 70 },
        { id: 'gae', name: 'Go Ahead Eagles', strength: 69 },
        { id: 'nec', name: 'NEC', strength: 68 },
        { id: 'for', name: 'Fortuna Sittard', strength: 66 },
        { id: 'spa', name: 'Sparta Rotterdam', strength: 67 },
        { id: 'her', name: 'Heracles Almelo', strength: 65 },
        { id: 'pec', name: 'PEC Zwolle', strength: 64 },
        { id: 'wil', name: 'Willem II', strength: 63 },
        { id: 'nac', name: 'NAC Breda', strength: 65 },
        { id: 'rkc', name: 'RKC Waalwijk', strength: 62 },
        { id: 'alm', name: 'Almere City FC', strength: 60 },
        { id: 'tel', name: 'Telstar', strength: 58 },
      ];
    }

    function baseSquad() {
      return [
        { id: 1, name: 'R. van Dijk', pos: 'GK', rating: 82, fitness: 100, rested: false },
        { id: 2, name: 'B. Kessler', pos: 'GK', rating: 70, fitness: 100, rested: false },

        { id: 3, name: 'J. Timmermans', pos: 'DEF', rating: 79, fitness: 100, rested: false },
        { id: 4, name: 'D. Osei', pos: 'DEF', rating: 77, fitness: 100, rested: false },
        { id: 5, name: 'L. de Ridder', pos: 'DEF', rating: 76, fitness: 100, rested: false },
        { id: 6, name: 'M. Verhoeven', pos: 'DEF', rating: 75, fitness: 100, rested: false },
        { id: 7, name: 'F. Bakker', pos: 'DEF', rating: 68, fitness: 100, rested: false },
        { id: 8, name: 'S. el Idrissi', pos: 'DEF', rating: 66, fitness: 100, rested: false },

        { id: 9,  name: 'K. Vermeulen', pos: 'MID', rating: 80, fitness: 100, rested: false },
        { id: 10, name: 'T. Janssen', pos: 'MID', rating: 78, fitness: 100, rested: false },
        { id: 11, name: 'Y. Boateng', pos: 'MID', rating: 77, fitness: 100, rested: false },
        { id: 12, name: 'R. Smeets', pos: 'MID', rating: 69, fitness: 100, rested: false },
        { id: 13, name: 'N. Kuypers', pos: 'MID', rating: 67, fitness: 100, rested: false },
        { id: 14, name: 'A. Dekker', pos: 'MID', rating: 65, fitness: 100, rested: false },

        { id: 15, name: 'S. Bergmann', pos: 'ATT', rating: 81, fitness: 100, rested: false },
        { id: 16, name: 'I. Koffi', pos: 'ATT', rating: 83, fitness: 100, rested: false },
        { id: 17, name: 'W. van der Berg', pos: 'ATT', rating: 79, fitness: 100, rested: false },
        { id: 18, name: 'C. Marchetti', pos: 'ATT', rating: 70, fitness: 100, rested: false },
      ];
    }

    function freshTableRow(team) {
      return { ...team, played: 0, won: 0, draw: 0, lost: 0, gf: 0, ga: 0, pts: 0 };
    }

    function generateSchedule(teamIds) {
      const n = teamIds.length;
      let arr = teamIds.slice();
      const firstLeg = [];
      for (let r = 0; r < n - 1; r++) {
        const round = [];
        for (let i = 0; i < n / 2; i++) {
          const home = arr[i], away = arr[n - 1 - i];
          round.push(r % 2 === 0 ? [home, away] : [away, home]);
        }
        firstLeg.push(round);
        const fixed = arr[0];
        const rest = arr.slice(1);
        rest.unshift(rest.pop());
        arr = [fixed, ...rest];
      }
      const secondLeg = firstLeg.map(round => round.map(([h, a]) => [a, h]));
      return firstLeg.concat(secondLeg);
    }

    function newGameState() {
      const teams = baseTeams().map(freshTableRow);
      return {
        season: 1,
        matchdayIndex: 0,
        teams,
        squad: baseSquad(),
        schedule: generateSchedule(teams.map(t => t.id)),
        history: [],
        goalAchieved: false,
      };
    }

    function load() {
      try {
        const raw = localStorage.getItem(SAVE_KEY);
        if (raw) return JSON.parse(raw);
      } catch (e) { /* corrupt save, start fresh */ }
      return newGameState();
    }

    let state = load();

    function save() {
      localStorage.setItem(SAVE_KEY, JSON.stringify(state));
    }

    function resetGame() {
      if (!confirm('Weet je zeker dat je een nieuw spel wilt starten? Je huidige voortgang gaat verloren.')) return;
      state = newGameState();
      currentView = 'dashboard';
      save();
      render();
    }

    // ---------- helpers ----------
    function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
    function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

    function poisson(lambda) {
      lambda = Math.max(0.05, lambda);
      const L = Math.exp(-lambda);
      let k = 0, p = 1;
      do { k++; p *= Math.random(); } while (p > L);
      return k - 1;
    }

    function effective(p) { return p.rating * (0.7 + 0.3 * p.fitness / 100); }

    function ajaxTeam() { return state.teams.find(t => t.isAjax); }

    function sortedTable() {
      return state.teams.slice().sort((a, b) =>
        (b.pts - a.pts) || ((b.gf - b.ga) - (a.gf - a.ga)) || (b.gf - a.gf)
      );
    }

    function selectLineup(squad) {
      const groups = { GK: [], DEF: [], MID: [], ATT: [] };
      squad.forEach(p => groups[p.pos].push(p));
      const lineup = [];
      Object.keys(POS_NEED).forEach(pos => {
        const pool = groups[pos].slice().sort((a, b) => effective(b) - effective(a));
        const nonRested = pool.filter(p => !p.rested);
        const rested = pool.filter(p => p.rested);
        const need = POS_NEED[pos];
        const chosen = nonRested.slice(0, need);
        if (chosen.length < need) chosen.push(...rested.slice(0, need - chosen.length));
        lineup.push(...chosen);
      });
      return lineup;
    }

    function restedCountAvailable(pos) {
      const pool = state.squad.filter(p => p.pos === pos);
      const restedCount = pool.filter(p => p.rested).length;
      return pool.length - POS_NEED[pos] - restedCount;
    }

    function toggleRest(id) {
      const p = state.squad.find(pl => pl.id === id);
      if (!p) return;
      if (!p.rested && restedCountAvailable(p.pos) <= 0) return;
      p.rested = !p.rested;
      save();
      render();
    }

    function simulateGenericMatch(homeStrength, awayStrength) {
      const homeVar = homeStrength + randInt(-4, 4);
      const awayVar = awayStrength + randInt(-4, 4);
      const expHome = clamp(1.3 + (homeVar - awayVar) / 20 + HOME_ADV, 0.2, 4.5);
      const expAway = clamp(1.3 + (awayVar - homeVar) / 20 - HOME_ADV * 0.5, 0.2, 4.5);
      return [poisson(expHome), poisson(expAway)];
    }

    function applyResult(homeId, awayId, hg, ag) {
      const home = state.teams.find(t => t.id === homeId);
      const away = state.teams.find(t => t.id === awayId);
      home.played++; away.played++;
      home.gf += hg; home.ga += ag;
      away.gf += ag; away.ga += hg;
      if (hg > ag) { home.won++; away.lost++; home.pts += 3; }
      else if (hg < ag) { away.won++; home.lost++; away.pts += 3; }
      else { home.draw++; away.draw++; home.pts++; away.pts++; }
    }

    function playMatchday() {
      const matchday = state.schedule[state.matchdayIndex];
      const ajax = ajaxTeam();
      const ajaxFixture = matchday.find(([h, a]) => h === ajax.id || a === ajax.id);
      const ajaxIsHome = ajaxFixture[0] === ajax.id;
      const oppId = ajaxIsHome ? ajaxFixture[1] : ajaxFixture[0];
      const opp = state.teams.find(t => t.id === oppId);

      const lineup = selectLineup(state.squad);
      const tactic = TACTICS[pendingTactic];
      const atkPool = lineup.filter(p => p.pos === 'MID' || p.pos === 'ATT');
      const defPool = lineup.filter(p => p.pos === 'GK' || p.pos === 'DEF');
      const attackPower = (atkPool.reduce((s, p) => s + effective(p), 0) / atkPool.length) * tactic.attack;
      const defensePower = (defPool.reduce((s, p) => s + effective(p), 0) / defPool.length) * tactic.defense;

      const oppVar = opp.strength + randInt(-4, 4);
      const home = ajaxIsHome ? HOME_ADV : -HOME_ADV * 0.5;
      const expAjax = clamp(1.3 + (attackPower - oppVar) / 20 + home, 0.2, 4.8);
      const expOpp = clamp(1.3 + (oppVar - defensePower) / 20 - home, 0.2, 4.8);
      const ajaxGoals = poisson(expAjax);
      const oppGoals = poisson(expOpp);

      const scorerPool = atkPool.length ? atkPool : lineup;
      const events = [];
      for (let i = 0; i < ajaxGoals; i++) {
        const scorer = weightedPick(scorerPool);
        events.push({ minute: randInt(1, 90), side: 'ajax', text: `⚽ ${scorer.name} scoort!` });
      }
      for (let i = 0; i < oppGoals; i++) {
        events.push({ minute: randInt(1, 90), side: 'opp', text: `⚽ Doelpunt voor ${opp.name}` });
      }
      events.sort((a, b) => a.minute - b.minute);

      applyResult(
        ajaxIsHome ? ajax.id : opp.id,
        ajaxIsHome ? opp.id : ajax.id,
        ajaxIsHome ? ajaxGoals : oppGoals,
        ajaxIsHome ? oppGoals : ajaxGoals
      );

      matchday.forEach(([h, a]) => {
        if (h === ajax.id || a === ajax.id) return;
        const th = state.teams.find(t => t.id === h);
        const ta = state.teams.find(t => t.id === a);
        const [hg, ag] = simulateGenericMatch(th.strength, ta.strength);
        applyResult(h, a, hg, ag);
      });

      state.squad.forEach(p => {
        const played = lineup.includes(p);
        if (played) p.fitness = Math.max(30, p.fitness - randInt(8, 15));
        else p.fitness = Math.min(100, p.fitness + randInt(10, 18));
      });

      lastMatchResult = {
        opp, ajaxIsHome, ajaxGoals, oppGoals, events,
        homeName: ajaxIsHome ? 'Ajax' : opp.name,
        awayName: ajaxIsHome ? opp.name : 'Ajax',
        homeGoals: ajaxIsHome ? ajaxGoals : oppGoals,
        awayGoals: ajaxIsHome ? oppGoals : ajaxGoals,
      };

      state.matchdayIndex++;
      if (state.matchdayIndex >= state.schedule.length) {
        finishSeason();
        currentView = 'seasonend';
      } else {
        currentView = 'matchresult';
      }
      save();
      render();
    }

    function weightedPick(list) {
      const total = list.reduce((s, p) => s + p.rating, 0);
      let r = Math.random() * total;
      for (const p of list) {
        r -= p.rating;
        if (r <= 0) return p;
      }
      return list[list.length - 1];
    }

    function finishSeason() {
      const table = sortedTable();
      const position = table.findIndex(t => t.isAjax) + 1;
      const achieved = position <= 3;
      if (achieved) state.goalAchieved = true;
      state.history.push({ season: state.season, position, achieved });
    }

    function startNewSeason() {
      state.season++;
      state.matchdayIndex = 0;
      state.teams = state.teams.map(t => {
        const drifted = clamp(t.strength + randInt(-2, 3), 50, 92);
        return freshTableRow({ id: t.id, name: t.name, strength: drifted, isAjax: t.isAjax });
      });
      const order = state.teams.map(t => t.id).sort(() => Math.random() - 0.5);
      const ajaxIdIdx = order.indexOf('ajx');
      order.splice(ajaxIdIdx, 1);
      order.unshift('ajx');
      state.schedule = generateSchedule(order);
      state.squad.forEach(p => {
        p.fitness = 100;
        p.rested = false;
        p.rating = clamp(p.rating + randInt(-2, 3), 45, 95);
      });
      currentView = 'dashboard';
      save();
      render();
    }

    // ---------- rendering ----------
    function render() {
      const app = document.getElementById('app');
      app.innerHTML = tabsHtml() + viewHtml();
    }

    function tabsHtml() {
      const tabs = [
        ['dashboard', 'Overzicht'],
        ['squad', 'Selectie'],
        ['table', 'Stand'],
      ];
      return `<div class="tabs">${tabs.map(([id, label]) =>
        `<button class="${currentView === id ? 'active' : ''}" onclick="goTo('${id}')">${label}</button>`
      ).join('')}</div>`;
    }

    function goTo(view) { currentView = view; render(); }

    function viewHtml() {
      if (currentView === 'squad') return squadHtml();
      if (currentView === 'table') return tableHtml();
      if (currentView === 'match') return matchPrepHtml();
      if (currentView === 'matchresult') return matchResultHtml();
      if (currentView === 'seasonend') return seasonEndHtml();
      return dashboardHtml();
    }

    function dashboardHtml() {
      const ajax = ajaxTeam();
      const table = sortedTable();
      const position = table.findIndex(t => t.isAjax) + 1;
      const totalMd = state.schedule.length;
      const md = state.matchdayIndex;

      let goalLine = state.goalAchieved
        ? `<div class="banner success">🏆 Ajax heeft Champions League-voetbal bereikt (seizoen behaald in het verleden)!</div>`
        : '';

      let mainAction;
      if (md >= totalMd) {
        mainAction = `<button class="btn" onclick="goTo('seasonend')">Bekijk seizoensafsluiting</button>`;
      } else {
        const fixture = state.schedule[md];
        const ajaxFx = fixture.find(([h, a]) => h === ajax.id || a === ajax.id);
        const ajaxIsHome = ajaxFx[0] === ajax.id;
        const oppId = ajaxIsHome ? ajaxFx[1] : ajaxFx[0];
        const opp = state.teams.find(t => t.id === oppId);
        mainAction = `
          <div class="fixture">
            <div class="vs">${ajaxIsHome ? 'Ajax' : opp.name} vs ${ajaxIsHome ? opp.name : 'Ajax'}</div>
            <div class="venue">${ajaxIsHome ? 'Thuis' : 'Uit'} · speelronde ${md + 1} van ${totalMd}</div>
          </div>
          <div class="actions">
            <button class="btn" onclick="goTo('match')">Wedstrijd voorbereiden →</button>
          </div>`;
      }

      return `
        ${goalLine}
        <div class="card">
          <h2>Seizoen ${state.season}</h2>
          <div class="summary-grid">
            <div class="stat"><div class="label">Positie</div><div class="value">${position}e</div></div>
            <div class="stat"><div class="label">Punten</div><div class="value">${ajax.pts}</div></div>
            <div class="stat"><div class="label">Gespeeld</div><div class="value">${ajax.played}/${totalMd}</div></div>
            <div class="stat"><div class="label">Doelsaldo</div><div class="value">${ajax.gf - ajax.ga >= 0 ? '+' : ''}${ajax.gf - ajax.ga}</div></div>
          </div>
        </div>
        <div class="card">
          <h2>Doel: eindig top 3 voor Champions League-voetbal</h2>
          <p class="muted-small">Nummer 1 t/m 3 plaatsen zich voor Europees CL-voetbal. Plek 4-6 geeft Europa League / Conference League.</p>
          ${mainAction}
        </div>
        ${state.history.length ? historyCardHtml() : ''}
        <div class="actions">
          <button class="btn secondary" onclick="resetGame()">Nieuw spel</button>
        </div>
      `;
    }

    function historyCardHtml() {
      return `
        <div class="card">
          <h2>Seizoensgeschiedenis</h2>
          <ul class="history-list">
            ${state.history.slice().reverse().map(h =>
              `<li><span>Seizoen ${h.season}</span><span>${h.position}e plaats ${h.achieved ? '🏆' : ''}</span></li>`
            ).join('')}
          </ul>
        </div>
      `;
    }

    function squadHtml() {
      const order = { GK: 'Doel', DEF: 'Verdediging', MID: 'Middenveld', ATT: 'Aanval' };
      return `
        <div class="card">
          <h2>Selectie & fitheid</h2>
          <p class="muted-small">Laat spelers rusten om fitheid te sparen — een uitgeruste ploeg presteert beter.</p>
          ${Object.keys(order).map(pos => `
            <h3>${order[pos]}</h3>
            ${state.squad.filter(p => p.pos === pos).sort((a,b) => b.rating - a.rating).map(p => `
              <div class="player-row ${p.rested ? 'rested' : ''}">
                <span class="pos-badge">${pos}</span>
                <span class="name">${p.name}</span>
                <span class="rating">${p.rating}</span>
                <div class="fitness-bar"><i style="width:${p.fitness}%; background:${p.fitness > 60 ? '#10b981' : p.fitness > 35 ? '#f59e0b' : '#ef4444'}"></i></div>
                <label><input type="checkbox" ${p.rested ? 'checked' : ''} onchange="toggleRest(${p.id})" ${(!p.rested && restedCountAvailable(pos) <= 0) ? 'disabled' : ''}> rust</label>
              </div>
            `).join('')}
          `).join('')}
        </div>
      `;
    }

    function tableHtml() {
      const rows = sortedTable();
      return `
        <div class="card">
          <h2>Eredivisie stand — seizoen ${state.season}</h2>
          <div style="overflow-x:auto">
          <table class="league">
            <thead><tr>
              <th>#</th><th style="text-align:left">Club</th><th>W</th><th>G</th><th>V</th><th>P</th><th>DS</th><th>D</th><th>Pt</th>
            </tr></thead>
            <tbody>
              ${rows.map((t, i) => {
                const pos = i + 1;
                const zone = pos <= 3 ? 'zone-cl' : pos <= 6 ? 'zone-eu' : pos >= rows.length - 2 ? 'zone-degr' : '';
                return `<tr class="${t.isAjax ? 'ajax-row' : ''} ${zone}">
                  <td class="pos">${pos}</td>
                  <td class="club">${t.name}</td>
                  <td>${t.won}</td>
                  <td>${t.draw}</td>
                  <td>${t.lost}</td>
                  <td>${t.played}</td>
                  <td>${t.gf - t.ga}</td>
                  <td>${t.gf}-${t.ga}</td>
                  <td><strong>${t.pts}</strong></td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>
          </div>
          <div class="legend">
            <span><i style="background:#10b981"></i> Champions League</span>
            <span><i style="background:#f59e0b"></i> Europa / Conference League</span>
            <span><i style="background:#ef4444"></i> Degradatiezone</span>
          </div>
        </div>
      `;
    }

    function matchPrepHtml() {
      const ajax = ajaxTeam();
      const fixture = state.schedule[state.matchdayIndex];
      const ajaxFx = fixture.find(([h, a]) => h === ajax.id || a === ajax.id);
      const ajaxIsHome = ajaxFx[0] === ajax.id;
      const oppId = ajaxIsHome ? ajaxFx[1] : ajaxFx[0];
      const opp = state.teams.find(t => t.id === oppId);
      const avgFitness = Math.round(state.squad.reduce((s, p) => s + p.fitness, 0) / state.squad.length);

      return `
        <div class="card">
          <h2>Speelronde ${state.matchdayIndex + 1} van ${state.schedule.length}</h2>
          <div class="fixture">
            <div class="vs">${ajaxIsHome ? 'Ajax' : opp.name} vs ${ajaxIsHome ? opp.name : 'Ajax'}</div>
            <div class="venue">${ajaxIsHome ? 'Thuis' : 'Uit'} · tegenstander sterkte ${opp.strength}</div>
          </div>
          <p class="muted-small">Gemiddelde fitheid selectie: ${avgFitness}%</p>
          <h3>Kies je tactiek</h3>
          <div class="tactic-options">
            ${Object.keys(TACTICS).map(name => `
              <label>
                <input type="radio" name="tactic" value="${name}" ${pendingTactic === name ? 'checked' : ''} onchange="pendingTactic='${name}'; render()">
                <span class="t-name">${name}</span>
                <span class="t-desc">${TACTICS[name].desc}</span>
              </label>
            `).join('')}
          </div>
          <div class="actions">
            <button class="btn" onclick="playMatchday()">Speel wedstrijd ▶</button>
            <button class="btn secondary" onclick="goTo('squad')">Selectie bekijken</button>
          </div>
        </div>
      `;
    }

    function matchResultHtml() {
      const r = lastMatchResult;
      return `
        <div class="card">
          <h2>Wedstrijdverslag</h2>
          <div class="score">
            ${r.homeGoals} - ${r.awayGoals}
            <span class="team-name">${r.homeName} — ${r.awayName}</span>
          </div>
          <ul class="events">
            ${r.events.length ? r.events.map(e => `<li class="${e.side === 'ajax' ? 'home' : ''}"><span class="min">${e.minute}'</span>${e.text}</li>`).join('') : '<li>Doelpuntloos gelijkspel.</li>'}
          </ul>
          <div class="actions">
            <button class="btn" onclick="goTo('dashboard')">Verder →</button>
            <button class="btn secondary" onclick="goTo('table')">Bekijk stand</button>
          </div>
        </div>
      `;
    }

    function seasonEndHtml() {
      const table = sortedTable();
      const position = table.findIndex(t => t.isAjax) + 1;
      const achieved = position <= 3;
      return `
        <div class="banner ${achieved ? 'success' : 'fail'}">
          ${achieved
            ? `🏆 Gefeliciteerd! Ajax eindigde ${position}e en is geplaatst voor de Champions League!`
            : `Ajax eindigde ${position}e — net niet genoeg voor Champions League-voetbal. Volgend seizoen beter!`}
        </div>
        <div class="card">
          <h2>Eindstand seizoen ${state.season}</h2>
          <div style="overflow-x:auto">
          <table class="league">
            <thead><tr><th>#</th><th style="text-align:left">Club</th><th>P</th><th>D</th><th>Pt</th></tr></thead>
            <tbody>
              ${table.map((t, i) => `<tr class="${t.isAjax ? 'ajax-row' : ''}">
                <td>${i + 1}</td><td class="club">${t.name}</td><td>${t.played}</td><td>${t.gf - t.ga}</td><td><strong>${t.pts}</strong></td>
              </tr>`).join('')}
            </tbody>
          </table>
          </div>
        </div>
        <div class="actions">
          <button class="btn" onclick="startNewSeason()">Start seizoen ${state.season + 1} →</button>
          <button class="btn secondary" onclick="resetGame()">Nieuw spel</button>
        </div>
      `;
    }

    render();
  </script>
</body>
</html>

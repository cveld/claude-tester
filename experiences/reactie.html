<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reactietest</title>
  <link rel="stylesheet" href="../style.css" />
  <style>
    :root { --accent: #06b6d4; }

    .pad {
      width: 100%;
      height: 280px;
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 1.5rem;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
      user-select: none;
      transition: background .1s;
      margin-bottom: 1.5rem;
      padding: 1.5rem;
    }
    .pad.wait  { background: #475569; }
    .pad.ready { background: #06b6d4; }
    .pad.go    { background: #10b981; }
    .pad.early { background: #ef4444; }
    .pad small { display: block; font-size: 1rem; font-weight: 500; opacity: .85; margin-top: .5rem; }

    .stats {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .stat {
      flex: 1;
      background: #fff;
      border: 1.5px solid #e2e8f0;
      border-radius: .6rem;
      padding: 1rem;
      text-align: center;
    }
    .stat .label { font-size: .8rem; color: var(--muted); margin-bottom: .35rem; }
    .stat .value { font-size: 1.6rem; font-weight: 800; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <header>
    <nav>
      <span class="logo">Reactietest</span>
      <a href="../index.html" class="back-link">← Terug</a>
    </nav>
  </header>

  <main class="experience">
    <div class="pad wait" id="pad">
      Klik om te starten
      <small id="hint">Wacht tot het veld groen wordt en klik dan zo snel mogelijk.</small>
    </div>

    <div class="stats">
      <div class="stat">
        <div class="label">Laatste</div>
        <div class="value" id="last">—</div>
      </div>
      <div class="stat">
        <div class="label">Beste</div>
        <div class="value" id="best">—</div>
      </div>
      <div class="stat">
        <div class="label">Gemiddeld</div>
        <div class="value" id="avg">—</div>
      </div>
    </div>

    <button class="btn secondary" onclick="resetStats()">Statistieken wissen</button>
  </main>

  <script>
    const pad = document.getElementById('pad');
    const hint = document.getElementById('hint');
    const lastEl = document.getElementById('last');
    const bestEl = document.getElementById('best');
    const avgEl = document.getElementById('avg');

    let state = 'idle';   // idle | waiting | ready
    let timer = null;
    let startTime = 0;
    let times = [];

    function fmt(ms) { return ms + ' ms'; }

    function render() {
      if (!times.length) { lastEl.textContent = '—'; bestEl.textContent = '—'; avgEl.textContent = '—'; return; }
      lastEl.textContent = fmt(times[times.length - 1]);
      bestEl.textContent = fmt(Math.min(...times));
      avgEl.textContent = fmt(Math.round(times.reduce((a, b) => a + b, 0) / times.length));
    }

    function startWaiting() {
      state = 'waiting';
      pad.className = 'pad wait';
      pad.firstChild.textContent = 'Wacht op groen...';
      hint.textContent = 'Niet te vroeg klikken!';
      const delay = 1000 + Math.random() * 3000;
      timer = setTimeout(() => {
        state = 'ready';
        pad.className = 'pad go';
        pad.firstChild.textContent = 'KLIK!';
        hint.textContent = '';
        startTime = performance.now();
      }, delay);
    }

    function handleClick() {
      if (state === 'idle') {
        startWaiting();
      } else if (state === 'waiting') {
        clearTimeout(timer);
        state = 'idle';
        pad.className = 'pad early';
        pad.firstChild.textContent = 'Te vroeg!';
        hint.textContent = 'Klik om opnieuw te proberen.';
      } else if (state === 'ready') {
        const reaction = Math.round(performance.now() - startTime);
        times.push(reaction);
        render();
        state = 'idle';
        pad.className = 'pad ready';
        pad.firstChild.textContent = fmt(reaction);
        hint.textContent = 'Klik om opnieuw te starten.';
      }
    }

    function resetStats() {
      times = [];
      render();
    }

    pad.addEventListener('click', handleClick);
    render();
  </script>
</body>
</html>

name: Inspect QR link

on:
  push:
    branches:
      - ccr-7540233a-ps6p0s
    paths:
      - .github/workflows/inspect-qr.yml

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Follow redirects
        run: |
          curl -sSL -D - -o /tmp/page.html -w "\nFINAL: %{url_effective} (%{http_code})\n" https://qr.codes/dWZ3lt
          echo "---- SIZE"; wc -c /tmp/page.html
      - name: Print page
        run: head -c 60000 /tmp/page.html
